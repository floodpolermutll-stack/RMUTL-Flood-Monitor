<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ระบบติดตามระดับน้ำ</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header class="site-header">
      <div>
        <p class="eyebrow">WATER MONITORING</p>
        <h1>ระบบติดตามระดับน้ำ</h1>
        <p class="subtitle">ข้อมูลระดับน้ำจากสถานีตรวจวัดแบบออนไลน์</p>
      </div>

      <div class="header-meta">
        <div class="live-clock">
          <span class="pulse"></span>
          <span id="liveClock">กำลังโหลดเวลา…</span>
        </div>

        <div class="updated" id="globalUpdated">
          กำลังโหลดข้อมูล…
        </div>
      </div>
    </header>

    <main>
      <section
        class="station-grid"
        id="stationCards"
        aria-label="สถานีวัดระดับน้ำ"
      ></section>

      <section class="panel controls">
        <div>
          <label for="stationSelect">เลือกสถานี</label>
          <select id="stationSelect"></select>
        </div>

        <div>
          <label for="dateInput">เลือกวันที่ดูย้อนหลัง</label>

          <div class="date-control">
            <button
              class="date-step"
              type="button"
              id="previousDate"
              aria-label="วันก่อนหน้า"
            >
              ‹
            </button>

            <input type="date" id="dateInput" />

            <button
              class="date-step"
              type="button"
              id="nextDate"
              aria-label="วันถัดไป"
            >
              ›
            </button>
          </div>
        </div>

        <button type="button" id="refreshButton">
          รีเฟรชข้อมูล
        </button>
      </section>

      <section class="dashboard-grid">
        <article class="panel chart-panel">
          <div class="panel-title">
            <div>
              <p class="eyebrow">ระดับน้ำ</p>
              <h2 id="chartTitle">กราฟระดับน้ำ</h2>
              <p class="chart-date" id="chartDateLabel">
                กำลังโหลดข้อมูล
              </p>
            </div>

            <span id="unitLabel">เมตร</span>
          </div>

          <div class="chart-wrap">
            <canvas id="waterChart"></canvas>
          </div>

          <p class="notice" id="chartNotice"></p>
        </article>

        <article class="panel map-panel">
          <div class="panel-title">
            <div>
              <p class="eyebrow">ตำแหน่ง</p>
              <h2>แผนที่สถานีวัดระดับน้ำ</h2>
            </div>
          </div>

          <div id="map" aria-label="แผนที่ตำแหน่งสถานี"></div>
        </article>
      </section>
    </main>

    <footer>
      ระบบแสดงผลระดับน้ำ · ข้อมูลอ้างอิงจาก Google Sheets
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
